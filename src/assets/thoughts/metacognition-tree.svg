<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="rg-crown" cx="50%" cy="10%" r="45%">
      <stop offset="0%" stop-color="rgba(120,140,255,0.36)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="rg-root" cx="50%" cy="92%" r="40%">
      <stop offset="0%" stop-color="rgba(80,100,220,0.22)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="node-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.6" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="rgb(6,9,22)"/>
  <rect width="900" height="300" fill="url(#rg-crown)"/>
  <rect width="900" height="300" fill="url(#rg-root)"/>
  <rect width="900" height="300" fill="url(#dots)"/>

  <!-- Ghost watermark -->
  <text x="876" y="288" font-size="200" font-weight="900" fill="rgba(165,180,252,0.04)"
        font-family="serif" text-anchor="end">01</text>

  <!-- Trunk glow -->
  <path d="M 450,22 L 450,278" stroke="rgba(180,196,255,0.28)" stroke-width="8" filter="url(#glow)"/>
  <!-- Trunk crisp -->
  <path d="M 450,22 L 450,278" stroke="rgba(200,212,255,0.5)" stroke-width="1.8"/>

  <!-- PRODUCTS (6) y=22 — lotus petals at crown -->
  <g filter="url(#glow)" opacity="0.88">
    <path d="M 450,22 C 450,10 450,2 450,-2" stroke="#c4cffe" stroke-width="6" stroke-linecap="round"/>
    <path d="M 450,22 C 442,10 436,2 440,-2" stroke="#c4cffe" stroke-width="5" stroke-linecap="round"/>
    <path d="M 450,22 C 458,10 464,2 460,-2" stroke="#c4cffe" stroke-width="5" stroke-linecap="round"/>
    <path d="M 450,22 C 444,12 438,4 443,0" stroke="#a5b4fc" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 450,22 C 456,12 462,4 457,0" stroke="#a5b4fc" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <path d="M 450,22 C 450,10 450,2 450,-2" stroke="rgba(220,228,255,0.92)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 450,22 C 442,10 436,2 440,-2" stroke="rgba(200,212,255,0.88)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 450,22 C 458,10 464,2 460,-2" stroke="rgba(200,212,255,0.88)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 450,22 C 444,12 438,4 443,0" stroke="rgba(165,180,252,0.72)" stroke-width="1" stroke-linecap="round"/>
  <path d="M 450,22 C 456,12 462,4 457,0" stroke="rgba(165,180,252,0.72)" stroke-width="1" stroke-linecap="round"/>

  <!-- TACTICS (5) y=64 -->
  <g filter="url(#glow)" opacity="0.75">
    <path d="M 450,64 C 380,64 292,54 230,44" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/>
    <path d="M 450,64 C 520,64 608,54 670,44" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M 450,64 C 380,64 292,54 230,44" stroke="rgba(185,200,255,0.90)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 450,64 C 520,64 608,54 670,44" stroke="rgba(185,200,255,0.90)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- STRATEGY (4) y=106 -->
  <g filter="url(#glow)" opacity="0.75">
    <path d="M 450,106 C 350,106 214,92 140,78" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round"/>
    <path d="M 450,106 C 550,106 686,92 760,78" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path d="M 450,106 C 350,106 214,92 140,78" stroke="rgba(185,200,255,0.90)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 450,106 C 550,106 686,92 760,78" stroke="rgba(185,200,255,0.90)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- MISSION (3) y=150 — widest, brightest -->
  <g filter="url(#glow)" opacity="0.85">
    <path d="M 450,150 C 310,150 124,134 30,118" stroke="#c4cffe" stroke-width="10" stroke-linecap="round"/>
    <path d="M 450,150 C 590,150 776,134 870,118" stroke="#c4cffe" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M 450,150 C 310,150 124,134 30,118" stroke="rgba(215,224,255,0.94)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 450,150 C 590,150 776,134 870,118" stroke="rgba(215,224,255,0.94)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- VISION (2) y=192 — no branches, trunk only -->

  <!-- VALUES (1) y=234 — upper roots -->
  <g filter="url(#glow)" opacity="0.68">
    <path d="M 450,234 C 344,234 180,248 90,264" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/>
    <path d="M 450,234 C 556,234 720,248 810,264" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M 450,234 C 344,234 180,248 90,264" stroke="rgba(175,192,255,0.86)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 450,234 C 556,234 720,248 810,264" stroke="rgba(175,192,255,0.86)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- BACKSTORY (0) y=272 — deep roots -->
  <g filter="url(#glow)" opacity="0.64">
    <path d="M 450,272 C 334,272 140,286 40,300" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/>
    <path d="M 450,272 C 390,276 260,290 180,302" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round"/>
    <path d="M 450,272 C 510,276 640,290 720,302" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round"/>
    <path d="M 450,272 C 566,272 760,286 860,300" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M 450,272 C 334,272 140,286 40,300" stroke="rgba(175,192,255,0.84)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 450,272 C 390,276 260,290 180,302" stroke="rgba(165,180,252,0.72)" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 450,272 C 510,276 640,290 720,302" stroke="rgba(165,180,252,0.72)" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M 450,272 C 566,272 760,286 860,300" stroke="rgba(175,192,255,0.84)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Node glow halos -->
  <g filter="url(#node-glow)">
    <circle cx="450" cy="22"  r="10" fill="rgba(210,222,255,0.78)"/>
    <circle cx="450" cy="64"  r="8"  fill="rgba(165,180,252,0.65)"/>
    <circle cx="450" cy="106" r="8"  fill="rgba(165,180,252,0.65)"/>
    <circle cx="450" cy="150" r="13" fill="rgba(210,222,255,0.84)"/>
    <circle cx="450" cy="192" r="7"  fill="rgba(165,180,252,0.52)"/>
    <circle cx="450" cy="234" r="8"  fill="rgba(165,180,252,0.64)"/>
    <circle cx="450" cy="272" r="10" fill="rgba(165,180,252,0.70)"/>
  </g>
  <!-- Crisp dots -->
  <circle cx="450" cy="22"  r="4.5" fill="#e0e7ff"/>
  <circle cx="450" cy="64"  r="3.5" fill="#c4cffe"/>
  <circle cx="450" cy="106" r="3.5" fill="#c4cffe"/>
  <circle cx="450" cy="150" r="5.5" fill="#e0e7ff"/>
  <circle cx="450" cy="192" r="3"   fill="#a5b4fc"/>
  <circle cx="450" cy="234" r="3.5" fill="#c4cffe"/>
  <circle cx="450" cy="272" r="4.5" fill="#c4cffe"/>

  <!-- Ambient particles -->
  <circle cx="100"  cy="55"  r="1.2" fill="rgba(165,180,252,0.28)"/>
  <circle cx="800"  cy="62"  r="1"   fill="rgba(165,180,252,0.24)"/>
  <circle cx="145"  cy="118" r="1"   fill="rgba(165,180,252,0.22)"/>
  <circle cx="755"  cy="110" r="1.2" fill="rgba(165,180,252,0.22)"/>
  <circle cx="60"   cy="190" r="1"   fill="rgba(165,180,252,0.18)"/>
  <circle cx="840"  cy="184" r="1"   fill="rgba(165,180,252,0.18)"/>
  <circle cx="200"  cy="254" r="1.2" fill="rgba(165,180,252,0.22)"/>
  <circle cx="700"  cy="248" r="1"   fill="rgba(165,180,252,0.22)"/>
</svg>
