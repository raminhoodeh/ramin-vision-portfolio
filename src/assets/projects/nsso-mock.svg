<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f89ac"/>
      <stop offset="0.55" stop-color="#5a769d"/>
      <stop offset="1" stop-color="#43618b"/>
    </linearGradient>
    <radialGradient id="sun" cx="82%" cy="14%" r="42%">
      <stop offset="0" stop-color="#ffb361" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ff9933" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff9933" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cfe0ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#cfe0ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb6cf"/>
      <stop offset="1" stop-color="#3d567b"/>
    </linearGradient>
  </defs>

  <!-- dark margin + browser frame -->
  <rect width="1600" height="1000" fill="#0a0e14"/>
  <rect x="40" y="30" width="1520" height="942" rx="20" fill="#0d1117"/>
  <rect x="40" y="30" width="1520" height="50" rx="20" fill="#11161f"/>
  <rect x="40" y="60" width="1520" height="20" fill="#11161f"/>
  <circle cx="70" cy="55" r="6" fill="#f7655b"/><circle cx="92" cy="55" r="6" fill="#f7bd4f"/><circle cx="114" cy="55" r="6" fill="#5ec45e"/>
  <rect x="610" y="42" width="380" height="26" rx="13" fill="#0a0e14"/>
  <text x="800" y="60" font-size="14" fill="#8b97a6" text-anchor="middle">nsso.me/ramin</text>

  <!-- page (clipped) -->
  <clipPath id="page"><rect x="40" y="80" width="1520" height="892" rx="0"/></clipPath>
  <g clip-path="url(#page)">
    <rect x="40" y="80" width="1520" height="892" fill="url(#sky)"/>
    <rect x="40" y="80" width="1520" height="892" fill="url(#sun)"/>
    <ellipse cx="380" cy="430" rx="300" ry="90" fill="url(#cloud)"/>
    <ellipse cx="1180" cy="640" rx="360" ry="110" fill="url(#cloud)"/>
    <ellipse cx="780" cy="900" rx="520" ry="150" fill="url(#cloud)"/>

    <!-- glass navbar -->
    <rect x="110" y="112" width="1380" height="58" rx="29" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.20"/>
    <text x="146" y="148" font-size="24" font-weight="700" fill="#ffffff">nsso</text>
    <g fill="#ffffff" fill-opacity="0.7" font-size="15">
      <text x="1120" y="147" text-anchor="end">Profile</text>
      <text x="1210" y="147" text-anchor="end">Shop</text>
    </g>
    <rect x="1330" y="124" width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.92"/>
    <text x="1394" y="146" font-size="14" font-weight="600" fill="#2c3e57" text-anchor="middle">Sign up</text>

    <!-- LEFT: identity -->
    <rect x="110" y="214" width="190" height="190" rx="34" fill="url(#avatar)" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="205" y="328" font-size="58" font-weight="700" fill="#ffffff" fill-opacity="0.9" text-anchor="middle">RH</text>

    <text x="332" y="270" font-size="44" fill="#ffffff"><tspan font-weight="400">I'm </tspan><tspan font-weight="700">Ramin Hoodeh</tspan></text>
    <text x="334" y="312" font-size="22" fill="#ffffff" fill-opacity="0.72">AI Product Manager · Builder · Fiction Author</text>

    <!-- bio glass card -->
    <rect x="110" y="436" width="720" height="150" rx="28" fill="#000000" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.15"/>
    <rect x="110" y="436" width="720" height="150" rx="28" fill="#ffffff" fill-opacity="0.04"/>
    <g fill="#ffffff" fill-opacity="0.84" font-size="17">
      <text x="138" y="478">I turn frontier-model capability into intuitive, beautifully crafted</text>
      <text x="138" y="506">products — and open-source the platform underneath them.</text>
      <text x="138" y="534" fill-opacity="0.6">9 years in product · currently a PM at Bayut.</text>
    </g>

    <!-- experience / qualifications cards -->
    <g>
      <rect x="110" y="612" width="350" height="226" rx="24" fill="#000000" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="138" y="650" font-size="13" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">EXPERIENCE</text>
      <g fill="#ffffff" font-opacity="1"><circle cx="142" cy="684" r="4" fill="#ffffff" fill-opacity="0.4"/><circle cx="142" cy="724" r="4" fill="#ffffff" fill-opacity="0.4"/><circle cx="142" cy="764" r="4" fill="#ffffff" fill-opacity="0.4"/></g>
      <g font-size="15" fill="#ffffff" fill-opacity="0.86"><text x="160" y="689">Bayut — AI Product Manager</text><text x="160" y="729">Side.inc — Senior PM</text><text x="160" y="769">Perkbox Vivup — Senior PM</text></g>
    </g>
    <g>
      <rect x="480" y="612" width="350" height="226" rx="24" fill="#000000" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="508" y="650" font-size="13" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">QUALIFICATIONS</text>
      <g font-size="15" fill="#ffffff" fill-opacity="0.86"><text x="508" y="689">IBM — AI Engineering</text><text x="508" y="729">Google — ML Engineer</text><text x="508" y="769">Anthropic Academy — MCP</text></g>
    </g>

    <!-- RIGHT: link cards -->
    <g>
      <rect x="880" y="214" width="610" height="74" rx="22" fill="#000000" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="910" y="258" font-size="18" font-weight="600" fill="#ffffff">LinkedIn</text>
      <text x="1456" y="259" font-size="22" fill="#ffffff" fill-opacity="0.5" text-anchor="end">→</text>
      <rect x="880" y="300" width="610" height="74" rx="22" fill="#000000" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="910" y="344" font-size="18" font-weight="600" fill="#ffffff">Portfolio — ramin.vision</text>
      <text x="1456" y="345" font-size="22" fill="#ffffff" fill-opacity="0.5" text-anchor="end">→</text>
      <rect x="880" y="386" width="610" height="74" rx="22" fill="#000000" fill-opacity="0.22" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="910" y="430" font-size="18" font-weight="600" fill="#ffffff">Shop — courses &amp; book</text>
      <rect x="1330" y="404" width="128" height="38" rx="19" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="1394" y="429" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle"> Pay</text>
    </g>

    <!-- products grid hint -->
    <text x="880" y="512" font-size="15" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">PRODUCTS &amp; SERVICES</text>
    <g>
      <rect x="880" y="528" width="196" height="200" rx="20" fill="#000000" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="1087" y="528" width="196" height="200" rx="20" fill="#000000" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="1294" y="528" width="196" height="200" rx="20" fill="#000000" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="900" y="548" width="156" height="92" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="1107" y="548" width="156" height="92" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="1314" y="548" width="156" height="92" rx="12" fill="#ffffff" fill-opacity="0.08"/>
      <g font-size="14" fill="#ffffff" fill-opacity="0.8"><text x="900" y="668">Product OS course</text><text x="1107" y="668">PM course</text><text x="1314" y="668">Fiction book</text></g>
    </g>

    <!-- AI chat pill -->
    <rect x="1196" y="876" width="294" height="58" rx="29" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="1226" y="912" font-size="16" fill="#ffffff">Ask me anything</text>
    <text x="1456" y="913" font-size="18" fill="#ffffff" text-anchor="end">✨</text>
  </g>
</svg>
