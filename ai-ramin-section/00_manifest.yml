version: 6
phase: 6
last_audited: "2026-05-20"
purpose: >
  AI Ramin context manifest. This file classifies the raw source material and
  tracks the canonical, story-bank, framework, policy, and RAG specification layers created for future ingestion.

retrieval_defaults:
  exclude_raw_archive: true
  exclude_system_files: true
  prefer_canonical_sources: true
  allow_frameworks_only_as_reasoning_scaffolds: true
  require_public_safe_visibility_for_website_answers: true
  require_uncertainty_response_when_evidence_is_weak: true

source_types:
  canonical_personal_context: "Ramin-specific facts, experience, product philosophy, work history, metrics, and evidence."
  work_experience: "Company or project-specific product work that can answer hiring-manager questions."
  story_bank: "Reusable Ramin-specific proof stories shaped for behavioural, product judgement, leadership, and hiring-fit answers."
  story_bank_candidate: "Draft interview/story material that should be converted into verified STAR/CAR/SOAR stories."
  framework_index: "Internal index for framework cards. Do not answer from the index."
  generic_framework: "External/general PM strategy or interview material. Use for structure only, not factual claims about Ramin."
  answer_strategy: "Reusable answer formats such as STAR, CAR, PAR, SOAR, product case framing, tradeoff framing, and AI PM framing."
  policy_index: "Internal index for policy cards. Do not answer from the index."
  voice_policy: "Writing style, cover letter, resume, and tone guidance."
  guardrail_policy: "Safety, scope, abuse, privacy, and uncertainty policies."
  source_policy: "Source hierarchy, trust, visibility, conflict-resolution, and citation behaviour."
  contact_policy: "Fallback behaviour for unsupported claims, current availability, scheduling, or human confirmation."
  abuse_policy: "Spam, misuse, harassment, inappropriate content, and rate-limit guidance."
  privacy_policy: "Private, confidential, sensitive, and credential-handling policy."
  rag_index: "Internal index for RAG build-spec files. Do not answer from the index."
  ingestion_policy: "Chunking, metadata, ingestion validation, and corpus update workflow."
  retrieval_policy: "Retrieval, ranking, answer assembly, and post-generation checking guidance."
  eval_policy: "Evaluation questions, expected retrieval, and answer-quality scoring guidance."
  raw_archive: "Original source material retained for traceability but excluded from normal retrieval."
  system_file: "Non-content operating-system file. Exclude."

trust_levels:
  canonical: "Safe to use as source of truth after Phase 2 cleanup."
  draft_personal: "Contains Ramin-specific material but needs verification, cleanup, or rewriting before public use."
  generic: "Useful for frameworks only; not evidence about Ramin."
  private_or_sensitive: "May inform internal preparation but should not be surfaced directly."
  exclude: "Do not ingest."

files:
  - path: "ai-ramin-context/PM Experience & Interview Prep 2a86fe2ecf3780d68f85f0edd9085933.md"
    title: "PM Experience & Interview Prep"
    primary_source_type: canonical_personal_context
    secondary_source_types:
      - work_experience
      - story_bank_candidate
    trust_level: draft_personal
    visibility: public_candidate_after_cleanup
    retrieval_permission: restructure_before_ingestion
    priority: highest
    notes:
      - "Best source for Ramin-specific career context, product philosophy, company experience, GTM, revenue models, tech stacks, ESG regulation exposure, and collaboration style."
      - "Should be split into canonical profile, product philosophy, work-experience files, and story-bank candidates."
      - "Contains some interview-positioning language that should be rewritten for public chatbot use."

  - path: "ai-ramin-context/Interview Questions and Answers 2aa6fe2ecf37809490a2fcbd613f7a3b.md"
    title: "Interview Questions and Answers"
    primary_source_type: story_bank_candidate
    secondary_source_types:
      - answer_strategy
      - generic_framework
    trust_level: draft_personal
    visibility: mixed_private_and_public
    retrieval_permission: restructure_before_ingestion
    priority: high
    notes:
      - "Contains useful AI PM interview framework material and Ramin-specific draft answers."
      - "Company-specific Novata answers should not be surfaced unless the user explicitly asks for interview/application preparation."
      - "Extract verified stories into story-bank files and move general frameworks into frameworks."

  - path: "ai-ramin-context/How to answer product manager interview questions.md"
    title: "How to Answer Product Manager Interview Questions"
    primary_source_type: generic_framework
    secondary_source_types:
      - answer_strategy
    trust_level: generic
    visibility: internal_framework_only
    retrieval_permission: framework_only_after_distillation
    priority: medium
    notes:
      - "Useful for answer shape, concision, and PM interview categories."
      - "Example answers should not be represented as Ramin's experience."
      - "Distill into answer strategy cards rather than ingesting verbatim."

  - path: "ai-ramin-context/Product Manager Interview on Behavioural .md"
    title: "Product Manager Interview on Behavioural"
    primary_source_type: generic_framework
    secondary_source_types:
      - answer_strategy
      - raw_archive
    trust_level: generic
    visibility: internal_framework_only
    retrieval_permission: archive_and_distill
    priority: medium
    content_warnings:
      - "Large exported file."
      - "Contains embedded image/export artifacts."
      - "Contains generic examples and interview coaching material."
    notes:
      - "Useful for behavioural interview principles, preparation mistakes, and answer structures."
      - "Should be excluded from direct RAG retrieval until distilled into frameworks/interview-answering-strategies.md."

  - path: "ai-ramin-context/Product Manager Interview Guide.md"
    title: "Product Manager Interview Guide"
    primary_source_type: generic_framework
    secondary_source_types:
      - answer_strategy
      - raw_archive
    trust_level: generic
    visibility: internal_framework_only
    retrieval_permission: archive_and_distill
    priority: medium
    content_warnings:
      - "Very large exported file."
      - "Contains embedded image/export artifacts and external article content."
      - "Contains generic cases, examples, and frameworks."
    notes:
      - "Useful for assumption testing, estimation, product strategy, launch, design, pricing, tradeoffs, and metric framing."
      - "Should be cleaned and summarized into framework cards. Do not ingest raw."

  - path: "ai-ramin-context/Cover Letter Structure 3396fe2ecf3780e08b72c8b61793e234.md"
    title: "Cover Letter Structure"
    primary_source_type: voice_policy
    secondary_source_types:
      - answer_strategy
    trust_level: generic
    visibility: internal_policy_only
    retrieval_permission: policy_only_after_distillation
    priority: medium
    notes:
      - "Useful for AI Ramin's answer style: clear, specific, evidence-led, human tone."
      - "Should become policies/answer-style.md rather than factual context."

  - path: "ai-ramin-context/CV Resumé 3376fe2ecf3780d4bdeadc4f35cff841.md"
    title: "CV / Resume"
    primary_source_type: voice_policy
    trust_level: generic
    visibility: internal_policy_only
    retrieval_permission: policy_only_after_distillation
    priority: low
    notes:
      - "Thin resume-positioning note. Useful as resume policy, not as Ramin evidence."

  - path: "ai-ramin-context/.DS_Store"
    title: ".DS_Store"
    primary_source_type: system_file
    trust_level: exclude
    visibility: none
    retrieval_permission: exclude
    priority: none
    notes:
      - "macOS metadata file. Do not ingest."

